<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Zhaoyu Wang — Embodied AI, World Models, Robot Learning</title>
  <desc id="banner-description">A dark blue research profile banner with cyan accents. An abstract diagram on the right connects vision and touch to action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A172B"/>
      <stop offset="1" stop-color="#102F48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62E0E5"/>
      <stop offset="1" stop-color="#64A9F8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2398AF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2398AF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L5 3.5 L1 6" fill="none" stroke="#65C5D7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <ellipse cx="1005" cy="167" rx="295" ry="218" fill="url(#glow)"/>
  <path d="M824 52V268 M874 52V268 M924 52V268 M974 52V268 M1024 52V268 M1074 52V268 M1124 52V268 M824 68H1142 M824 118H1142 M824 168H1142 M824 218H1142 M824 268H1142" stroke="#A4E2F1" stroke-opacity="0.035" fill="none"/>

