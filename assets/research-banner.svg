    <circle cx="920" cy="104" r="36" fill="#102C42" stroke="#60D6E2" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle cx="1080" cy="104" r="36" fill="#102C42" stroke="#60D6E2" stroke-opacity="0.75" stroke-width="1.5"/>
